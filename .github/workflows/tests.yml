name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Each action is pinned to a commit, its release named beside it: a tag can be moved, a commit cannot.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-tests:
    name: core and data desktop tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      # Also checks the Gradle wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run the gate
        run: ./gradlew :core:desktopTest :data:desktopTest

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            data/build/reports/tests/
            core/build/test-results/
            data/build/test-results/

  # SPEC:R05: the Android and Windows shells build from the repository root, so a dependency or
  # plugin update that breaks either app fails here. The Android debug build is the one installed (R09).
  shells:
    name: Android and Windows shells build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build the shells
        run: ./gradlew :android:assembleDebug :windows:assemble

      # SPEC:R205: the Windows app's printed lines and exit codes.
      - name: Test the Windows app
        run: ./gradlew :windows:test

      # SPEC:R61, R196, R197, R206: the device tests need a device to run (tools/device/run.sh); here they
      # are only built, so a change elsewhere cannot leave them broken unnoticed.
      - name: Build the device tests
        run: ./gradlew :data:assembleAndroidDeviceTest
