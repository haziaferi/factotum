name: Dependency submission

# GitHub's dependency graph does not read Gradle files itself, so without this Dependabot alerts see
# no Gradle dependency. Gradle resolves every configuration and the graph is sent to GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Each action is pinned to a commit, its release named beside it: a tag can be moved, a commit cannot.
permissions: {}

concurrency:
  group: dependency-submission
  cancel-in-progress: true

jobs:
  submit:
    name: submit the Gradle dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The dependency submission API needs write access to the repository's contents.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        env:
          # What the app runs with is scoped 'runtime': the Android app's debug build (the one installed)
          # and release build, the libraries' Android and desktop targets, and the Windows shell.
          # Everything else (the Gradle plugins, lint, KSP processors, tests) is scoped 'development', so
          # an alert in a build tool is told apart from one in the app.
          DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: "^(debugRuntimeClasspath|releaseRuntimeClasspath|androidRuntimeClasspath|desktopRuntimeClasspath|runtimeClasspath)$"
