<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factotum palette groups</title>
<!-- Template for tools/screens/palette_groups.py, which writes palette-groups.html with the front in place of DATA.
     Edit this file, not the generated one. -->
<style>
:root{--pg:#f4f4f2;--pfg:#1c1c1a;--pdim:#66665f;--pline:#d6d6d0;--pcard:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--pg:#141517;--pfg:#e6e5e1;--pdim:#9c9a94;--pline:#34363a;--pcard:#1d1f22}}
:root[data-theme=dark]{--pg:#141517;--pfg:#e6e5e1;--pdim:#9c9a94;--pline:#34363a;--pcard:#1d1f22}
*{box-sizing:border-box}
body{margin:0;padding:20px 16px 48px;background:var(--pg);color:var(--pfg);font:14px/1.5 system-ui,sans-serif}
h1{font-size:21px;margin:0 0 4px}p{max-width:84ch}.dim{color:var(--pdim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr));gap:14px;margin-top:14px}
.g{background:var(--pcard);border-radius:14px;padding:12px 14px;box-shadow:inset 0 0 0 1px var(--pline)}
.g h3{margin:0 0 2px;font-size:14px}.g .who{font-size:12.5px;color:var(--pdim);margin:0 0 8px}.g .who b{color:var(--pfg);font-weight:600}
.g .nums{font:11px ui-monospace,monospace;color:var(--pdim);margin-top:6px}
.two{display:flex;gap:10px;flex-wrap:wrap}
/* the mini home: one shared ground and ink, each module in its own palette's primary */
.mh{flex:1 1 240px;min-width:0;background:var(--gr);color:var(--ink);border-radius:12px;padding:9px;font-size:12px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.25)}
.mh .z{background:var(--rs);border-radius:9px;padding:6px 8px}
.mh .z h4{margin:0 0 3px;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;display:flex;gap:6px;align-items:center}
.mh .z h4 i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.mh .r{display:flex;align-items:center;gap:7px;padding:2px 0}.mh .r .x{flex:1}
.mh .bar{width:3px;align-self:stretch;border-radius:2px;background:var(--cal)}
.mh .btn{background:var(--rou);color:var(--rouink);border-radius:999px;padding:1px 9px;font-size:10.5px}
.mh .tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mh .tile{border-radius:9px;padding:7px 8px;background:color-mix(in srgb,var(--chk) 22%,var(--gr));box-shadow:inset 3px 0 0 var(--chk)}
.mh .nav{display:flex;justify-content:space-around;font-size:10px;opacity:.85;padding-top:2px}
.mh .nav span{padding:1px 8px;border-radius:999px}.mh .nav .on{background:color-mix(in srgb,var(--cal) 25%,var(--gr));font-weight:600}
.sw{display:flex;gap:4px;margin-top:4px}.sw span{flex:1;height:14px;border-radius:4px}
</style>
</head>
<body>
<h1>Palette groups: Calendar, Routines, Check-in</h1>
<p class="dim" id="intro"></p>
<div class="grid" id="out"></div>
<script>
const D = {"front": [{"members": [{"keyword": "Swiss / International", "oblique": false, "pair": "Pair 2", "light": {"primary": "#1D3A57", "secondary": "#6588AD", "accent": "#F4D33F", "surface": "#F4F4F2", "text": "#141412"}, "dark": {"primary": "#72A2CA", "secondary": "#5C738A", "accent": "#F4D03F", "surface": "#17181A", "text": "#F2F2EF"}}, {"keyword": "Wabi Sabi", "oblique": true, "pair": "Sun-bleached Bark", "light": {"primary": "#9D8F7B", "secondary": "#B5AFA6", "accent": "#7F594E", "surface": "#F4F4F2", "text": "#2C251D"}, "dark": {"primary": "#645B4F", "secondary": "#867A65", "accent": "#855648", "surface": "#17181A", "text": "#E5E5DE"}}, {"keyword": "Serene / Calm", "oblique": false, "pair": "Chalk", "light": {"primary": "#755E4F", "surface": "#F4F4F2", "text": "#292622"}, "dark": {"primary": "#CBBBA9", "surface": "#17181A", "text": "#E3DFD6"}}], "harmony": 1.0, "template": "complementary", "balance": 39.5, "cvd": 17.9, "normal": 19.3}, {"members": [{"keyword": "Ming Blue-and-White", "oblique": true, "pair": "Day and night", "light": {"primary": "#164A79", "accent": "#0C195F", "surface": "#F4F4F2", "text": "#1E232D"}, "dark": {"primary": "#134C75", "accent": "#4A65B8", "surface": "#17181A", "text": "#F0F0F2"}}, {"keyword": "Wabi Sabi", "oblique": true, "pair": "Sun-bleached Bark", "light": {"primary": "#9D8F7B", "secondary": "#B5AFA6", "accent": "#7F594E", "surface": "#F4F4F2", "text": "#2C251D"}, "dark": {"primary": "#645B4F", "secondary": "#867A65", "accent": "#855648", "surface": "#17181A", "text": "#E5E5DE"}}, {"keyword": "Introverted-rainy", "oblique": true, "pair": "Rainy register", "light": {"primary": "#818BA7", "secondary": "#9BA4B0", "accent": "#507086", "surface": "#F4F4F2", "text": "#1F252E"}, "dark": {"primary": "#7882A1", "secondary": "#9BA4B0", "accent": "#466174", "surface": "#17181A", "text": "#D3D9E1"}}], "harmony": 0.988, "template": "complementary", "balance": 31.6, "cvd": 18.6, "normal": 22.2}, {"members": [{"keyword": "Swiss / International", "oblique": false, "pair": "Pair 2", "light": {"primary": "#1D3A57", "secondary": "#6588AD", "accent": "#F4D33F", "surface": "#F4F4F2", "text": "#141412"}, "dark": {"primary": "#72A2CA", "secondary": "#5C738A", "accent": "#F4D03F", "surface": "#17181A", "text": "#F2F2EF"}}, {"keyword": "Health / Consumer Wellbeing", "oblique": false, "pair": "Linen", "light": {"primary": "#8E2A26", "surface": "#F4F4F2", "text": "#26221E"}, "dark": {"primary": "#E19C8E", "surface": "#17181A", "text": "#EAE5DF"}}, {"keyword": "Serene / Calm", "oblique": false, "pair": "Still Water", "light": {"primary": "#3E6D5A", "surface": "#F4F4F2", "text": "#1F2726"}, "dark": {"primary": "#B0C9BE", "surface": "#17181A", "text": "#DDE5E2"}}], "harmony": 0.9684, "template": "split-complementary", "balance": 20.1, "cvd": 11.4, "normal": 22.7}, {"members": [{"keyword": "Ming Blue-and-White", "oblique": true, "pair": "Day and night", "light": {"primary": "#164A79", "accent": "#0C195F", "surface": "#F4F4F2", "text": "#1E232D"}, "dark": {"primary": "#134C75", "accent": "#4A65B8", "surface": "#17181A", "text": "#F0F0F2"}}, {"keyword": "Wabi Sabi", "oblique": true, "pair": "Clay & Umber", "light": {"primary": "#9F8C69", "secondary": "#B7AA97", "accent": "#A35D3F", "surface": "#F4F4F2", "text": "#2D251E"}, "dark": {"primary": "#594F3D", "secondary": "#343029", "accent": "#7C4730", "surface": "#17181A", "text": "#DFDCD3"}}, {"keyword": "Introverted-rainy", "oblique": true, "pair": "Rainy register", "light": {"primary": "#818BA7", "secondary": "#9BA4B0", "accent": "#507086", "surface": "#F4F4F2", "text": "#1F252E"}, "dark": {"primary": "#7882A1", "secondary": "#9BA4B0", "accent": "#466174", "surface": "#17181A", "text": "#D3D9E1"}}], "harmony": 0.9615, "template": "complementary", "balance": 29.0, "cvd": 21.7, "normal": 23.8}, {"members": [{"keyword": "Ming Blue-and-White", "oblique": true, "pair": "Day and night", "light": {"primary": "#164A79", "accent": "#0C195F", "surface": "#F4F4F2", "text": "#1E232D"}, "dark": {"primary": "#134C75", "accent": "#4A65B8", "surface": "#17181A", "text": "#F0F0F2"}}, {"keyword": "Wabi Sabi", "oblique": true, "pair": "Clay & Umber", "light": {"primary": "#9F8C69", "secondary": "#B7AA97", "accent": "#A35D3F", "surface": "#F4F4F2", "text": "#2D251E"}, "dark": {"primary": "#594F3D", "secondary": "#343029", "accent": "#7C4730", "surface": "#17181A", "text": "#DFDCD3"}}, {"keyword": "Goryeo Celadon", "oblique": true, "pair": "Day and night", "light": {"primary": "#BDD3D0", "accent": "#030303", "surface": "#F4F4F2", "text": "#232629"}, "dark": {"primary": "#CBDCDC", "accent": "#FDFEFE", "surface": "#17181A", "text": "#E7EEEC"}}], "harmony": 0.8148, "template": "near-complementary", "balance": 55.8, "cvd": 24.5, "normal": 26.4}], "counts": {"groups": 180, "ok": 58, "front": 5}, "ground": {"light": "#F4F4F2", "dark": "#17181A"}};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const INK = {light: "#1c1c1a", dark: "#e6e5e1"}, RAISED = {light: "#ffffff", dark: "#202125"};
const lum = h => { const c = [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(x => x <= .04045 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4);
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
const cr = (a, b) => (Math.max(lum(a), lum(b)) + .05) / (Math.min(lum(a), lum(b)) + .05);
const lab = m => `${m.oblique ? "★ " : ""}${esc(m.keyword)} · ${esc(m.pair)}`;
function home(g, mode) {
  const [cal, rou, chk] = g.members.map(m => m[mode].primary), gr = D.ground[mode];
  const rouink = cr(INK.light, rou) >= cr(INK.dark, rou) ? INK.light : INK.dark;
  return `<div class="mh" style="--gr:${gr};--ink:${INK[mode]};--rs:${RAISED[mode]};--cal:${cal};--rou:${rou};--rouink:${rouink};--chk:${chk}">
    <div class="z" style="--c:${cal}"><h4><i></i>Agenda</h4><div class="r"><span class="bar"></span><span style="width:32px;opacity:.7">09:00</span><span class="x">Dentist</span></div></div>
    <div class="z" style="--c:${rou}"><h4><i></i>Routines</h4><div class="r"><span class="x">Walk</span><span class="btn">Log</span></div><div class="r"><span class="x">Water 3 of 8</span><span class="btn">Log</span></div></div>
    <div class="tiles"><div class="tile">How are things? ›</div><div class="tile">Ledger ›</div></div>
    <div class="nav"><span class="on">Today</span><span>Week</span><span>Hub</span><span>Routines</span><span>Pages</span></div>
    <div class="sw"><span style="background:${cal}" title="calendar ${cal}"></span><span style="background:${rou}" title="routines ${rou}"></span><span style="background:${chk}" title="check-in ${chk}"></span></div></div>`;
}
document.getElementById("intro").innerHTML = `${D.counts.groups} groups were scored (one adapted palette per module, on the shared ground #F4F4F2 / #17181A).
  <b>${D.counts.ok}</b> keep the three module colours apart (CIEDE2000 ≥ 10) with normal vision and under all three simulated colour blindnesses, in light and dark.
  The <b>${D.counts.front}</b> below are the best trade-offs among those: harmony of the three hues, even balance against the ground, and colour-blind margin.
  Each module shows its palette's main colour; the ground and ink are shared, as they would be on the real home.`;
document.getElementById("out").innerHTML = D.front.map((g, i) => `<div class="g"><h3>Group ${i + 1}</h3>
  <p class="who"><b>Calendar</b> ${lab(g.members[0])}<br><b>Routines</b> ${lab(g.members[1])}<br><b>Check-in</b> ${lab(g.members[2])}</p>
  <div class="two">${home(g, "light")}${home(g, "dark")}</div>
  <div class="nums">harmony ${g.harmony.toFixed(2)} (${esc(g.template)}) · balance spread ${g.balance} · apart: normal ${g.normal}, colour-blind worst ${g.cvd}</div></div>`).join("");
</script>
</body>
</html>
